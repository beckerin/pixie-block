name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.2'
        fetch-depth: 0

    - name: Build
      run: npx nx run pixie-block:build

    - name: Test
      run: npx nx affected -t lint test build
